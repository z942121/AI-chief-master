services:
  mysql:
    image: mysql:8.0
    container_name: ai-chief-mysql
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # MySQL 镜像不允许 MYSQL_USER=root，覆盖为普通用户
      # root 密码由 MYSQL_ROOT_PASSWORD 控制
      MYSQL_USER: ai_chief_app
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-chief-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Docker 环境下覆盖 MySQL 主机名
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-chief-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data:
    name: ai_chief_mysql_data
  chroma_data:
    name: ai_chief_chroma_data

networks:
  app-network:
    name: ai_chief_network
    driver: bridge
